<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Biomol"><meta name="theme-color" content="#294e1c">
<title>Test de Biologia molecular</title>
<style>:root { --bg:#eef5ea; --surface:#fafdf8; --ink:#1d2a17; --muted:#5d6d55; --line:#d6e6cd; --head:#294e1c; --accent:#3e762a; --ko:#b23b2e;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --f-body:"Source Sans 3","Helvetica Neue",Arial,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1720; --surface:#26212d; --ink:#f0ebf5; --muted:#b0a6bd; --line:#3d3548; --head:#110e15; --accent:#c9a6ee; --ko:#f08a7c; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.caixa { width: 100%; max-width: 420px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 28px 24px; }
.ull { width: 44px; height: 44px; border-radius: 50%; background: var(--head); display: grid; place-items: center; margin-bottom: 14px; }
.ull i { width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 5px var(--accent); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
p { margin: 0 0 16px; color: var(--muted); font-size: .93rem; }
label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 11px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.recorda { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; font-size: .88rem; color: var(--muted); }
button { width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; background: var(--head); color: #fff; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--ko); font-size: .88rem; min-height: 1.3em; margin: 10px 0 0; }
.peu { margin: 16px 0 0; font-size: .78rem; }
.app { margin-top: 14px; border-top: 1.5px solid var(--line); padding-top: 12px; font-size: .85rem; }
.app summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.app p { margin: 8px 0 0; color: var(--ink); font-size: .85rem; }

/* capçalera: la il·lustració d'oftalmo tenyida de verd */
.cap-art svg { filter: hue-rotate(-150deg) saturate(.85) brightness(1.02); }

.caixa { box-shadow: 0 12px 44px rgba(20,50,10,.18), 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent); }
button#go { background: linear-gradient(118deg, #1f3d15 0%, #294e1c 50%, #549e39 100%); box-shadow: 0 6px 18px -8px rgba(20,50,10,.6), inset 0 1px 0 rgba(230,250,220,.25); }
button#go:hover { filter: brightness(1.08); }

<main class="caixa" id="caixa">
  <div class="ull" aria-hidden="true"><i></i></div>
  <h1>Test de Biologia molecular</h1>
  <p id="intro">Accés amb contrasenya fins al 10 de novembre de 2026.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Contrasenya</label>
    <input type="password" id="pw" required autocomplete="current-password">
    <div class="recorda"><input type="checkbox" id="rec" checked><label for="rec" style="margin:0;font-weight:500">Recorda-la en aquest dispositiu</label></div>
    <button id="go" type="submit">Obre el test</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="peu">Els resultats es guarden només al navegador de cada dispositiu.</p>
  <details class="app" id="app-ajuda"><summary>Instal·la-ho com una app</summary>

    <p><b>Android</b> (Chrome): <b>⋮</b> → <b>Instal·la l'aplicació</b></p>
  </details>

<script>
"use strict";
const TANCA = Date.parse("2026-11-09T23:00:00Z");
const CLAU = "test-biomol-b1-pw";
const HEADTAGS = `<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Biomol"><meta name="theme-color" content="#294e1c">`;
const P = JSON.parse(document.getElementById("xifrat").textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function guarda(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function llegeix(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function tancat() {
  guarda(CLAU, null);
  document.getElementById("caixa").innerHTML = `<div class="ull" aria-hidden="true"><i></i></div><h1>Accés tancat</h1><p>Aquest test es va poder fer servir fins al 10 de novembre de 2026. Ara ja no està disponible.</p>`;
}
async function desxifra(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));   // contrasenya dolenta → error
  const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  return await ds.text();
}
// comptador anònim: el primer cop que un dispositiu obre el test, envia només el nom del repositori a un Google Form
function compta() {
  const K = "test-biomol-b1-comptat";
  if (llegeix(K)) return;
  try {
    const d = new URLSearchParams({ "entry.1608672960": "test-biomol-b1" });
    fetch("https://docs.google.com/forms/d/e/1FAIpQLSdEQvgU3gwEYiE9hQ6eA62rVEPR71MmpL9glnHfMg603hPwuQ/formResponse", { method: "POST", mode: "no-cors", body: d, keepalive: true })
      .then(() => guarda(K, "1")).catch(() => {});
  } catch (e) {}
}
function obre(html) { document.open(); document.write(html.replace("<head>", "<head>" + HEADTAGS)); document.close(); }
async function intenta(pw, auto) {
  if (Date.now() >= TANCA) return tancat();
  const err = document.getElementById("err"), go = document.getElementById("go");
  go.disabled = true; go.textContent = "Obrint…"; err.textContent = "";
  let html;
  try { html = await desxifra(pw); }
  catch (e) {
    go.disabled = false; go.textContent = "Obre el test";
    if (auto) { guarda(CLAU, null); return; }
    err.textContent = (typeof DecompressionStream === "undefined" || !window.crypto || !crypto.subtle)
      ? "Aquest navegador és massa antic per obrir el test. Prova amb Chrome, Safari o Firefox actualitzats."
      : "Contrasenya incorrecta.";
    return;
  }
  if (document.getElementById("rec").checked || auto) guarda(CLAU, pw);
  compta();
  obre(html);
}
if (Date.now() >= TANCA) tancat();
else {
  try { if (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches) document.getElementById("app-ajuda").hidden = true; } catch (e) {}
  // web app: funciona sense connexió després de la primera obertura
  try { if (typeof navigator !== "undefined" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  const desada = llegeix(CLAU);
  if (desada) intenta(desada, true);
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); intenta(document.getElementById("pw").value, false); });
}
